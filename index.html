  <script>
    // Set the theme before first paint: saved choice, else system preference.
    (function () {
      try {
        var saved = localStorage.getItem("theme");
        var dark = saved
          ? saved === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.classList.toggle("dark", dark);
      } catch (e) {}
    })();
  </script>

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "LetsWatchMovie",
      "alternateName": "LWM",
      "url": "https://letswatchmovie.pages.dev/",
      "description": "Browse movies and TV shows, build a watchlist and press play.",
      "inLanguage": "en",
      "publisher": { "@type": "Person", "name": "Nirajan Malla" },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://letswatchmovie.pages.dev/search/{search_term_string}"
        },
        "query-input": "required name=search_term_string"

    }
